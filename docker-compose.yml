# .env.example fornece valores locais; .env e opcional e sobrescreve esses valores.
# Copie .env.example para .env para personalizar:
# cp .env.example .env
# Subir (construindo as imagens): docker compose up --build -d
# Acompanhar os logs:             docker compose logs -f
# Derrubar mantendo os dados:     docker compose down
# Derrubar e apagar os dados:     docker compose down -v

services:
  backend:
    image: elite-dev-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-leilao_dev}"
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  sync-itens:
    image: elite-dev-backend:local
    command: ["python", "-m", "app.jobs.sync_itens"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-leilao_dev}"
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    ports:
      - "5173:5173"

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: